<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor">
  <!-- outer ring, open at the top for the moustache -->
  <path d="M55 27 A86 86 0 1 0 145 27" stroke-width="4.5" stroke-linecap="round"/>
  <!-- moustache -->
  <path fill="currentColor" stroke="none" d="M100 24c-4.5-6.5-13.5-8-19.5-3.5-4.5 3-10.5 3-14-1.3 1.3 8 9 12.8 17.3 11.5 8-1.3 12.5-4.5 16.2-6.2 3.7 1.7 8.2 4.9 16.2 6.2 8.3 1.3 16-3.5 17.3-11.5-3.5 4.3-9.5 4.3-14 1.3-6-4.5-15-3-19.5 3.5z"/>
  <!-- straight razor (left) -->
  <g transform="rotate(-36 100 82)">
    <rect x="94.5" y="38" width="11" height="38" rx="1.5" fill="currentColor" stroke="none"/>
    <rect x="96.5" y="77" width="7" height="30" rx="3.5" stroke-width="3.5"/>
  </g>
  <!-- scissors (right) -->
  <g transform="rotate(36 100 82)" stroke-linecap="round">
    <path d="M97.5 40 L99.2 88" stroke-width="4.5"/>
    <path d="M102.5 40 L100.8 88" stroke-width="4.5"/>
    <circle cx="94" cy="97" r="6.5" stroke-width="3.5"/>
    <circle cx="106" cy="97" r="6.5" stroke-width="3.5"/>
  </g>
  <text x="100" y="143" text-anchor="middle" fill="currentColor" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="27">W &amp; W</text>
  <text x="100" y="161" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9" letter-spacing="2.6">BARBER SHOP</text>
</svg>
